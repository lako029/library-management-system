[project]
name = "library-management-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Omar Ellakany", email = "omar.ellakany97@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.5",
    "langchain-openai>=1.7.1",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "streamlit[auth]>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
library-management-system = "library_management_system:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "library_management_system"
module-root = ""
